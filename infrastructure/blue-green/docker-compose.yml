#--- Mini Project 2.3: Blue/Green Deployment ---

services:

  #--- Blue: Current production environment ---
  blue:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: itsd4350-flask:blue
    container_name: itsd4350-blue
    environment:
      APP_ENV: production-blue
      APP_VERSION: "1.0"
    expose:
      - "8000"
    networks:
      - blue_green_network
    restart: unless-stopped

  #--- Green: New production environment ---
  green:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: itsd4350-flask:green
    container_name: itsd4350-green
    environment:
      APP_ENV: production-green
      APP_VERSION: "2.0"
    expose:
      - "8000"
    networks:
      - blue_green_network
    restart: unless-stopped

  #--- NGINX: Production traffic router ---
  nginx:
    image: nginx:stable-alpine
    container_name: itsd4350-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - blue
      - green
    networks:
      - blue_green_network
    restart: unless-stopped

#--- Dedicated Docker network ---
networks:
  blue_green_network:
    driver: bridge
