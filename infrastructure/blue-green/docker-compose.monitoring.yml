# Mini Project 2.4 - Monitoring Services

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: itsd4350-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - blue_green_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: itsd4350-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:?Set GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:?Set GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER:?Set GRAFANA_SMTP_USER}
      GF_SMTP_FROM_NAME: ITSD4350 Grafana Monitoring
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - blue_green_network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
  prometheus_data:
