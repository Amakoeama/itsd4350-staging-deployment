name: Midterm CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py src

      - name: Run code quality checks
        run: python -m flake8 app.py src tests

      - name: Run automated tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -v

      - name: Confirm successful build
        run: echo 'Application build and tests completed successfully.'

      - name: Package application for deployment
        run: |
          mkdir -p dist
          tar -czf dist/staging-app.tar.gz \
            app.py \
            requirements.txt \
            src

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-application
          path: dist/staging-app.tar.gz
          if-no-files-found: error
          retention-days: 7
