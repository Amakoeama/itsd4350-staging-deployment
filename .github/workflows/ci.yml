name: Midterm CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py src

      - name: Run code quality checks
        run: python -m flake8 app.py src tests

      - name: Run automated tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -v

      - name: Confirm successful build
        run: echo 'Application build and tests completed successfully.'

      - name: Package application for deployment
        run: |
          mkdir -p dist
          tar -czf dist/staging-app.tar.gz \
            app.py \
            requirements.txt \
            src

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-application
          path: dist/staging-app.tar.gz
          if-no-files-found: error
          retention-days: 7


  deploy-staging:
    name: Deploy and Verify Staging
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/staging-deployment'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Download tested application artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-application
          path: deployment-package

      - name: Verify deployment artifact
        run: |
          tar -tzf deployment-package/staging-app.tar.gz
          tar -tzf deployment-package/staging-app.tar.gz | grep -q '^app.py$'

      - name: Trigger Render staging deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --show-error --silent \
            --retry 3 \
            --request POST "$DEPLOY_HOOK"

      - name: Verify live staging deployment
        env:
          STAGING_URL: https://itsd4350-staging-deployment.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ["STAGING_URL"] + "/health"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.load(response)

                  if (
                      data.get("status") == "healthy"
                      and data.get("environment") == "staging"
                  ):
                      print("Staging smoke test PASSED:", data)
                      break
              except Exception as error:
                  print("Waiting for staging:", error)

              time.sleep(10)
          else:
              raise SystemExit("Staging smoke test FAILED")
          PY
