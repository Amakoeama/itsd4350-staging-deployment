name: Terraform Staging Infrastructure

on:
  push:
    branches:
      - feature/terraform-staging-infrastructure
  workflow_dispatch:

jobs:
  staging-infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      #--- Retrieve project source ---
      - name: Checkout repository
        uses: actions/checkout@v4

      #--- Install Terraform ---
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      #--- Provision and verify staging ---
      - name: Provision staging infrastructure
        run: ./scripts/provision_staging.sh

      #--- Verify idempotence ---
      - name: Check infrastructure idempotence
        run: terraform -chdir=infrastructure/terraform/staging plan -detailed-exitcode

      #--- Destroy staging environment ---
      - name: Destroy staging infrastructure
        run: terraform -chdir=infrastructure/terraform/staging destroy -auto-approve

      #--- Recreate and verify staging ---
      - name: Recreate staging infrastructure
        run: ./scripts/provision_staging.sh

      #--- Clean up temporary runner infrastructure ---
      - name: Clean up staging resources
        if: always()
        run: terraform -chdir=infrastructure/terraform/staging destroy -auto-approve
